name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build AndroidSamples
        run: bash .github/scripts/build_androidsamples.sh -Dorg.gradle.project.ci=true --gradle-user-home=./.gradle

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: androidsamples-apks
          path: '**/build/**/*.apk'
