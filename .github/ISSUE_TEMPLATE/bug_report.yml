name: 🐞 Bug Report
description: Signaler un bug dans AndroidSamples
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire précisément le problème rencontré.

  - type: input
    id: module
    attributes:
      label: Module concerné
      placeholder: ex: provisioning-qr, device-owner-demo, core, enterprise…
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      placeholder: Décris clairement le comportement observé.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      placeholder: Quel comportement devrais-tu obtenir ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace
      render: bash
      placeholder: Ajoute les logs pertinents ici.

  - type: dropdown
    id: android_version
    attributes:
      label: Version Android
      options:
        - Android 8
        - Android 9
        - Android 10
        - Android 11
        - Android 12
        - Android 13
        - Android 14
    validations:
      required: true
