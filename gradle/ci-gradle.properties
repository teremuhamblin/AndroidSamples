# ============================================================
# AndroidSamples CI Gradle Configuration (Enterprise Edition)
# Optimisé pour GitHub Actions – Multi-modules – Kotlin – Android
# ============================================================

# --- Mémoire & JVM ---
org.gradle.jvmargs=-Xms4g -Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Daemon désactivé pour CI ---
org.gradle.daemon=false

# --- Workers limités pour stabilité CI ---
org.gradle.workers.max=2

# --- Build reproductible ---
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=false

# --- Kotlin optimisations CI ---
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# --- Logging propre pour GitHub Actions ---
org.gradle.logging.level=lifecycle
org.gradle.console=plain

# --- Android ---
android.enableBuildCache=true
android.useAndroidX=true

# --- Tests ---
android.testInstrumentationRunnerArguments.class=com.android.test.runner.AndroidJUnitRunner

# --- Réduction du bruit CI ---
systemProp.file.encoding=UTF-8
